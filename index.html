<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henry Kim</title>
    <meta
      name="description"
      content="Henry Kim — engineering student at the University of Toronto. Projects, essays, and activities."
    />
    <meta property="og:title" content="Henry Kim" />
    <meta
      property="og:description"
      content="Engineering student at the University of Toronto. Projects, essays, and activities."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://henrykim.ca/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') {
            document.body.classList.add('dark-mode');
            document.documentElement.classList.add('dark-mode');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // After a deploy, a cached index.html can reference a hashed bundle that
      // no longer exists on Pages — the page would render blank forever on
      // that device. One cache-busting reload heals it.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (
            t &&
            t.tagName === 'SCRIPT' &&
            t.src &&
            t.src.indexOf('/assets/') !== -1 &&
            !sessionStorage.getItem('bundle-reloaded')
          ) {
            sessionStorage.setItem('bundle-reloaded', '1');
            location.reload();
          }
        },
        true
      );
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
